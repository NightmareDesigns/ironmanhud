name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'IronManHUD_Clean/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Unity license secret
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Add a UNITY_LICENSE secret in the repository Actions settings."
            exit 1
          fi

      - name: Build Android APK
        uses: game-ci/unity-builder@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: IronManHUD_Clean
          targetPlatform: Android
          buildMethod: StarkIndustries.Editor.BuildScript.BuildForDevice
          customParameters: -device auto -buildPath Builds/IronManHUD.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        with:
          name: IronManHUD-Android-APK
          path: IronManHUD_Clean/Builds/IronManHUD.apk
          if-no-files-found: error
          retention-days: 14
