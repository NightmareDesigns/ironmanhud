name: Build Jessica Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-hud/**'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    paths:
      - 'desktop-hud/**'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-hud
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-hud/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript and test local AI connections
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable Windows x64 app
        run: npm run build:win
      - name: Verify packaged runtime and Windows speech
        run: |
          $package = 'dist/Jessica-win32-x64'
          foreach ($file in @('Jessica.exe', 'resources/app/main.js', 'resources/app/index.html', 'resources/app/preload.js', 'resources/app/voice.js', 'resources/app/voice.ps1')) {
            if (!(Test-Path "$package/$file")) { throw "Missing packaged file: $file" }
          }
          $env:ELECTRON_RUN_AS_NODE = '1'
          try {
            $result = & "$package/Jessica.exe" -e "require('./$package/resources/app/voice').windowsVoice('voices').then(r => { if (!Array.isArray(r.voices)) throw new Error('Invalid voice list'); console.log(JSON.stringify(r)); }).catch(e => { console.error(e); process.exitCode = 1; });"
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows speech check failed' }
            if (!$result) { throw 'Packaged runtime produced no voice result' }
            $result
          } finally {
            Remove-Item Env:ELECTRON_RUN_AS_NODE
          }
          Copy-Item SETUP.txt "$package/START-HERE.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Jessica-Windows-x64
          path: desktop-hud/dist/Jessica-win32-x64/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
