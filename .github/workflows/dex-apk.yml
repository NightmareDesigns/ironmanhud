name: Build Jessica DeX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'dex-hud/**'
      - '.github/workflows/dex-apk.yml'
  pull_request:
    paths:
      - 'dex-hud/**'
      - '.github/workflows/dex-apk.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dex-hud
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Add Android SDK command-line tools to PATH
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools are missing from $ANDROID_HOME."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Lint and build installable debug APK
        run: bash ./gradlew --no-daemon :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Jessica-DeX-APK
          path: dex-hud/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
