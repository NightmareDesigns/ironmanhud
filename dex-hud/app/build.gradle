plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
}

android {
    namespace 'com.nightmaredesigns.dexhud'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nightmaredesigns.dexhud'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
